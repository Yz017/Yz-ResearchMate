[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "researchmate"
version = "0.5.0"
description = "A local-first AI research assistant built with Google ADK."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "ResearchMate Developers" }]
dependencies = [
  "aiosqlite>=0.20,<1.0",
  "arxiv>=2.1,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "chromadb>=0.6,<2.0",
  "fastapi>=0.115,<1.0",
  "google-adk>=1.31,<2.0",
  "httpx>=0.28,<1.0",
  "litellm>=1.83,<2.0",
  "loguru>=0.7,<1.0",
  "mcp>=1.9,<2.0",
  "oss2>=2.19,<3.0",
  "pdfplumber>=0.11,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=5.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.9,<15.0",
  "semanticscholar>=0.8,<1.0",
  "sse-starlette>=2.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "trafilatura>=2.0,<3.0",
  "typer>=0.15,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
rag = [
  "FlagEmbedding>=1.3,<2.0",
  "sentence-transformers>=3.4,<6.0",
  "torch>=2.6,<3.0",
  "transformers>=4.44,<5.0",
]
ocr = [
  "pytesseract>=0.3,<1.0",
]

[dependency-groups]
dev = [
  "black>=25.1,<26.0",
  "mypy>=1.15,<2.0",
  "pandas>=2.2.3,<4.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "rouge-score>=0.1.2,<1.0",
  "ruff>=0.9,<1.0",
  "tabulate>=0.9,<1.0",
]

[project.scripts]
rmcli = "researchmate.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmate"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
  "FlagEmbedding.*",
  "chromadb.*",
  "google.*",
  "pdfplumber.*",
  "pypdf.*",
  "sentence_transformers.*",
  "torch",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
